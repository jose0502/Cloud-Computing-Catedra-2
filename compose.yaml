services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"        # R-04: Corregido el puerto interno (Nginx escucha en 80)
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-rescue123}@db:5432/${POSTGRES_DB:-appdb}"
    healthcheck:         # Corregido: Ahora es hermano de environment
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s  # Agregado para dar tiempo a que FastAPI arranque
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rescue123}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data  # R-06: Volumen para persistencia

volumes:
  postgres_data:         # R-06: Declaración del volumen nombrado
