services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"        # R-01: Corregido el puerto interno (Nginx escucha en 80)
    depends_on:
      - backend

   backend:
    build: ./backend
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-appuser}:${POSTGRES_PASSWORD:-rescue123}@db:5432/${POSTGRES_DB:-appdb}"
    depends_on:
      - db

    db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rescue123}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data  # R-04: Volumen para persistencia

volumes:
  postgres_data:         # R-04: Declaración del volumen nombrado
