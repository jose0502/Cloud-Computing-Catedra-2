services:
  frontend:
    build: ./frontend
    ports:
      - "8080:80"        # R-01: Corregido el puerto interno a 80
    depends_on:
      - backend

  backend:
    build: ./backend
    environment:
      # R-03: Corregido localhost por 'db' y la contraseña correcta
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data  # R-04: Volumen para persistencia

volumes:
  postgres_data:         # R-04: Declaración del volumen
